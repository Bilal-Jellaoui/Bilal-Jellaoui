<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 339" width="452" height="339" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Détection de fraude bancaire</title>
<desc id="d">Analyse de 284 807 transactions très déséquilibrées : comparaison de modèles, SMOTE et validation croisée. XGBoost retenu, intégré dans une application Flask avec API REST, journal SQLite et tableau de bord.</desc>
